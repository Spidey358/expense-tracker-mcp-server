services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_dev
    # Uncomment on Apple Silicon (M1/M2/M3) Macs; needs Rosetta enabled in Docker Desktop
    # platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql   # data survives container restarts
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa
        -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot helper: creates the application database once SQL Server is healthy
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" \
          -Q "IF DB_ID('$$DB_NAME') IS NULL CREATE DATABASE [$$DB_NAME]"
        echo "Database '$$DB_NAME' is ready."
    restart: "no"

volumes:
  mssql_data: